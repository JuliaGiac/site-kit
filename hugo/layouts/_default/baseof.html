<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }} · JuliaGiac</title>
  <meta name="description" content="{{ site.Params.description }}">
  <meta property="og:title" content="{{ site.Title }} · JuliaGiac">
  <meta property="og:description" content="{{ site.Params.description }}">
  <meta property="og:image" content="{{ "img/social-preview.png" | absURL }}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="{{ "img/favicon.svg" | relURL }}" type="image/svg+xml">
  <link rel="icon" href="{{ "img/favicon.png" | relURL }}" type="image/png">
  <link rel="apple-touch-icon" href="{{ "img/apple-touch-icon.png" | relURL }}">
  <link rel="stylesheet" href="{{ "syntax.css" | relURL }}">
  <link rel="stylesheet" href="{{ "style.css" | relURL }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <div class="top">
        <a href="https://juliagiac.github.io/"><img src="{{ "img/juliagiac-mark-light.svg" | relURL }}" alt="JuliaGiac" width="64" height="64"></a>
        <div>
          <p class="crumbs"><a class="org" href="https://juliagiac.github.io/">JuliaGiac</a><span class="sep">/</span><a href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a></p>
          {{ with site.Params.description }}<p class="tagline">{{ . }}</p>{{ end }}
        </div>
      </div>
      <nav class="site-nav">
        {{ range site.Menus.main }}<a href="{{ .URL | relURL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>{{ end }}
        <a class="back" href="https://juliagiac.github.io/">← All JuliaGiac projects</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    <div class="prose">
      {{ block "main" . }}{{ end }}
    </div>
  </main>
  <footer>
    <div class="wrap">
      {{ partial "footer.html" . }}
    </div>
  </footer>
</body>
</html>
